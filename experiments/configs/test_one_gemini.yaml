pricing_path: experiments/configs/pricing.yaml

# Single-condition config for a Gemini smoke test of the pipeline.
# Gemini CLI has no reasoning-effort flag, so effort must be null.
conditions:
  - id: B3_gemini_solo
    writer:
      cli: gemini
      model: gemini-3.8-flash
      effort: null
      timeout_s: 30000
    reviewer: null
    per_task_budget_usd: 100.0
